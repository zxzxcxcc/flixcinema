<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bigg Boss Season 20 - FlixCinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.4);
      --bg-dark: #07090e;
      --card-surface: #12151f;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-white: #ffffff;
      --text-sub: #94a3b8;
      --accent-btn: #1a1e2b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #161c2e 0%, var(--bg-dark) 50%);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Header Section */
    .header {
      text-align: center;
      padding: 20px 15px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-logo {
      max-width: 130px;
      width: 38%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(245, 158, 11, 0.25));
    }

    /* Season 20 Badge */
    .season-badge {
      display: inline-block;
      margin-top: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 2px;
      padding: 3px 12px;
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      text-transform: uppercase;
    }

    /* Powered by FlixCinema */
    .brand-tag {
      margin-top: 6px;
      font-size: 0.8rem;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .brand-tag a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .brand-tag a:hover {
      text-decoration: underline;
    }

    /* Container & 2-Column Grid */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 12px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Episode Card */
    .ep-card {
      background: var(--card-surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .ep-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .hd-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .ep-name {
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.35;
      color: #f1f5f9;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.3em;
    }

    /* Buttons */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      padding: 8px 2px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-stream {
      background: var(--primary);
      color: #0b0d14;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .btn-stream svg {
      fill: #0b0d14;
      width: 12px;
      height: 12px;
    }

    .btn-dl {
      background: var(--accent-btn);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-dl svg {
      fill: #cbd5e1;
      width: 12px;
      height: 12px;
    }

    /* Status Messages */
    .status-msg {
      text-align: center;
      padding: 50px 15px;
      color: var(--text-sub);
      font-size: 0.9rem;
      grid-column: span 2;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header class="header">
    <img 
      src="https://mir-s3-cdn-cf.behance.net/projects/404/83533e226955217.Y3JvcCw2MTMsNDc5LDM5MywxNTM.png" 
      alt="Bigg Boss" 
      class="header-logo"
    >
    <div class="season-badge">SEASON - 20</div>
    <div class="brand-tag">
      Powered by <a href="https://zxzxcxcc.github.io/flixcinema/" target="_blank" rel="noopener noreferrer">FlixCinema</a>
    </div>
  </header>

  <main class="container">
    <div class="episodes-grid" id="episodesList">
      <div class="status-msg">Episodes load ho rahe hain...</div>
    </div>
  </main>

  <script>
    // Exact path check
    const BASE_PATH = 'https://toolsmax.site/flixcinema/biggboss/';
    const POSSIBLE_FILES = ['episodes.json', 'episode.json', 'data.json'];
    const DEFAULT_POSTER = "https://image.tmdb.org/t/p/w500/k5ope1puShzLycqcj3FIoGAPjva.jpg";

    async function fetchJSONData() {
      // Multiple file names try karega taaki file name match issue na rahe
      for (const fileName of POSSIBLE_FILES) {
        try {
          const url = `${BASE_PATH}${fileName}?_nocache=${Date.now()}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) return data;
          }
        } catch (e) {
          // agla try karega
        }
      }
      return null;
    }

    async function loadEpisodes() {
      const container = document.getElementById('episodesList');
      
      try {
        const episodes = await fetchJSONData();

        if (!episodes) {
          container.innerHTML = `
            <div class="status-msg">
              <span style="color: #ef4444; font-weight: bold;">JSON File Nahi Mili!</span><br>
              Check karein ki file <code>episodes.json</code> name se <b>/flixcinema/bigboss/</b> folder me mojud hai ya nahi.
            </div>
          `;
          return;
        }

        if (episodes.length === 0) {
          container.innerHTML = '<div class="status-msg">Abhi koi episode add nahi hua hai. Admin panel se episode upload karein.</div>';
          return;
        }

        // Latest episode sabse pehle dikhane ke liye sort (Descending order)
        episodes.sort((a, b) => {
          const idA = parseInt(a.id) || 0;
          const idB = parseInt(b.id) || 0;
          return idB - idA;
        });

        container.innerHTML = episodes.map(ep => {
          // Pixeldrain ID handle karna
          let fileId = ep.file_id || '';
          if (!fileId && (ep.originalUrl || ep.download_url)) {
            const raw = ep.originalUrl || ep.download_url;
            fileId = raw.split('/').filter(Boolean).pop();
          }

          const streamUrl = ep.stream_url || `https://pixeldrain.dev/api/file/${fileId}`;
          const downloadUrl = ep.download_url || ep.originalUrl || `https://pixeldrain.dev/u/${fileId}`;
          const poster = ep.poster || DEFAULT_POSTER;
          const title = ep.title || 'Bigg Boss 20 Episode';

          // Android Intent for external player
          const intentUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=video/*;end`;

          return `
            <div class="ep-card">
              <div class="poster-box">
                <span class="hd-badge">HD</span>
                <img src="${poster}" alt="${title}" loading="lazy">
              </div>
              <div class="card-info">
                <div class="ep-name" title="${title}">${title}</div>
                <div class="button-group">
                  <a href="${intentUrl}" class="btn btn-stream">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Play
                  </a>
                  <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-dl">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    DL
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="status-msg" style="color: #ef4444;">Data parse karne me error aaya. Kripya JSON format check karein.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadEpisodes);
  </script>

</body>
</html>
