<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bigg Boss Season 20 - FlixCinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #f59e0b;
      --primary-glow: rgba(245, 158, 11, 0.35);
      --bg-dark: #07090e;
      --card-surface: #12151f;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-white: #ffffff;
      --text-sub: #94a3b8;
      --accent-btn: #1a1e2b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #151a2a 0%, var(--bg-dark) 45%);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Header Section */
    .header {
      text-align: center;
      padding: 22px 15px 16px;
      position: relative;
    }

    .header-logo {
      max-width: 140px;
      width: 40%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.2));
      transition: transform 0.3s ease;
    }

    .brand-tag {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .brand-tag a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .brand-tag a:hover {
      text-decoration: underline;
    }

    /* Container & 2-Column Grid */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 12px;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Episode Card */
    .ep-card {
      background: var(--card-surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .ep-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .hd-badge {
      position: absolute;
      top: 7px;
      left: 7px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: var(--primary);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .ep-name {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.3;
      color: #f1f5f9;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.3em;
    }

    /* Button Layout */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-stream {
      background: var(--primary);
      color: #0b0d14;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .btn-stream svg {
      fill: #0b0d14;
      width: 13px;
      height: 13px;
    }

    .btn-dl {
      background: var(--accent-btn);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-dl svg {
      fill: #cbd5e1;
      width: 13px;
      height: 13px;
    }

    /* State messages */
    .loader {
      text-align: center;
      padding: 50px 0;
      color: var(--text-sub);
      font-size: 0.95rem;
      grid-column: span 2;
    }

    .empty-box {
      text-align: center;
      padding: 40px 15px;
      color: var(--text-sub);
      grid-column: span 2;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <img 
      src="https://mir-s3-cdn-cf.behance.net/projects/404/83533e226955217.Y3JvcCw2MTMsNDc5LDM5MywxNTM.png" 
      alt="Bigg Boss Season 20" 
      class="header-logo"
    >
    <div class="brand-tag">
      Powered by <a href="https://zxzxcxcc.github.io/flixcinema/" target="_blank" rel="noopener noreferrer">FlixCinema</a>
    </div>
  </header>

  <main class="container">
    <div class="episodes-grid" id="episodesList">
      <div class="loader">Episodes load ho rahe hain...</div>
    </div>
  </main>

  <script>
    // JSON file ka path
    const JSON_URL = 'episodes.json';
    const DEFAULT_POSTER = "https://image.tmdb.org/t/p/w500/k5ope1puShzLycqcj3FIoGAPjva.jpg";

    async function loadEpisodes() {
      const container = document.getElementById('episodesList');
      try {
        // Cache bypass karne ke liye timestamp add kiya hai
        const response = await fetch(`${JSON_URL}?_t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('Data fetch failed');
        
        let episodes = await response.json();

        if (!Array.isArray(episodes) || episodes.length === 0) {
          container.innerHTML = '<div class="empty-box">Abhi koi naya episode uplabdh nahi hai.</div>';
          return;
        }

        // Naye episode ko hamesha pehle (Top) par rakhne ke liye sort karein
        episodes.sort((a, b) => (b.id || 0) - (a.id || 0));

        container.innerHTML = episodes.map(ep => {
          const fileId = ep.file_id || (ep.originalUrl ? ep.originalUrl.split('/').filter(Boolean).pop()) : '';
          const streamUrl = ep.stream_url || `https://pixeldrain.dev/api/file/${fileId}`;
          const downloadUrl = ep.download_url || ep.originalUrl || `https://pixeldrain.dev/u/${fileId}`;
          const poster = ep.poster || DEFAULT_POSTER;
          const title = ep.title || 'Bigg Boss Episode';

          // Android Universal Video Intent (MX Player, VLC, etc.)
          const intentUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=video/*;end`;

          return `
            <div class="ep-card">
              <div class="poster-box">
                <span class="hd-badge">HD</span>
                <img src="${poster}" alt="${title}" loading="lazy">
              </div>
              <div class="card-info">
                <div class="ep-name" title="${title}">${title}</div>
                <div class="button-group">
                  <a href="${intentUrl}" class="btn btn-stream">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Play
                  </a>
                  <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-dl">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    DL
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="empty-box">Episode load karne me dikkat hui. Kripya page refresh karein.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadEpisodes);
  </script>

</body>
</html>
