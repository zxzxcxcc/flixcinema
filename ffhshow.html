<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Full House With Rohit Sharma - FlixCinema</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ffaa00;
      --primary-hover: #ffbb33;
      --bg: #0b0d13;
      --card-bg: #141824;
      --card-hover: #1c2233;
      --text: #ffffff;
      --text-muted: #8e95a5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Full Width & Uncut Poster Section */
    .hero-wrapper {
      position: relative;
      width: 100%;
      background: #000;
    }

    .hero-img-box {
      width: 100%;
      line-height: 0;
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .hero-bottom-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(180deg, transparent, var(--bg));
      pointer-events: none;
    }

    /* Meta Details Below Poster */
    .show-details {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 8px;
      width: 100%;
    }

    .hero-title {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .meta-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge-season {
      background: rgba(255, 170, 0, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: 0.3s ease;
    }

    .brand-link:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--primary);
    }

    /* Main Episodes Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 50px;
      flex: 1;
    }

    .section-head {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 1 Row me 2 Cards Grid */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 10px;
    }

    .card-title {
      font-size: 0.84rem;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-play {
      background: var(--primary);
      color: #0b0d13;
    }

    .btn-play:active {
      transform: scale(0.96);
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
    }

    /* Loading / Error States */
    .state-box {
      grid-column: span 2;
      text-align: center;
      padding: 40px 15px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Full Poster View -->
  <div class="hero-wrapper">
    <div class="hero-img-box">
      <img src="https://images.slivcdn.com/videoasset_images/manage_file/1000024131/1789720680148261_Signature_Landscape_Thumb.jpg?w=500&q=low" alt="Family Full House With Rohit Sharma" class="hero-img">
      <div class="hero-bottom-fade"></div>
    </div>
  </div>

  <!-- Title, Season & Link Details -->
  <div class="show-details">
    <h1 class="hero-title">Family Full House With Rohit Sharma</h1>
    <div class="meta-bar">
      <span class="badge-season"><i class="fa-solid fa-film"></i> Season 1</span>
      <a href="https://zxzxcxcc.github.io/flixcinema/" target="_blank" rel="noopener noreferrer" class="brand-link">
        <i class="fa-solid fa-play-circle" style="color: var(--primary);"></i> by FlixCinema
      </a>
    </div>
  </div>

  <!-- Episodes Grid -->
  <main class="container">
    <div class="section-head">
      <h2 class="section-title">All Episodes</h2>
    </div>

    <div class="episodes-grid" id="episodes-list">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Episodes load ho rahe hain...</p>
      </div>
    </div>
  </main>

  <script>
    const JSON_URL = 'https://toolsmax.site/flixcinema/ffh-show/episodes.json';
    const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(JSON_URL);
    const BASE_PATH = 'https://toolsmax.site/flixcinema/ffh-show/';

    async function loadEpisodes() {
      const container = document.getElementById('episodes-list');

      let episodes = null;

      // 1. Pehle direct fetch koshish karega
      try {
        const res = await fetch(JSON_URL);
        if (res.ok) episodes = await res.json();
      } catch (e) {
        console.warn("Direct fetch fail hua, proxy se try kar rahe hain...");
      }

      // 2. Agar local storage / CORS block kare to proxy fallback
      if (!episodes) {
        try {
          const resProxy = await fetch(PROXY_URL);
          if (resProxy.ok) episodes = await resProxy.json();
        } catch (err) {
          console.error("Dono methods fail huye:", err);
        }
      }

      if (!episodes || !Array.isArray(episodes) || episodes.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p>Filhal koi episode uplabdh nahi hai.<br>Jald hi naye episodes add honge!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      episodes.forEach(ep => {
        let posterUrl = ep.poster || '';
        if (posterUrl && !posterUrl.startsWith('http')) {
          posterUrl = BASE_PATH + posterUrl;
        }

        let streamUrl = ep.stream_url || '';
        if (streamUrl && !streamUrl.startsWith('http')) {
          streamUrl = BASE_PATH + streamUrl;
        }

        let downloadUrl = ep.download_url || '';
        if (downloadUrl && !downloadUrl.startsWith('http')) {
          downloadUrl = BASE_PATH + downloadUrl;
        }

        const intentUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=video/*;end`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-thumb">
            <img src="${posterUrl}" alt="${ep.title || 'Episode'}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-title">${ep.title || 'Episode'}</div>
            <div class="actions-grid">
              <a href="${intentUrl}" class="btn btn-play">
                <i class="fa-solid fa-play"></i> Play
              </a>
              <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-download">
                <i class="fa-solid fa-download"></i> Save
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', loadEpisodes);
  </script>
</body>
</html>
