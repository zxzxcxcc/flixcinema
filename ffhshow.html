<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Full House With Rohit Sharma - FlixCinema</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ffaa00;
      --primary-hover: #ffbb33;
      --bg: #0b0d13;
      --card-bg: #141824;
      --card-hover: #1c2233;
      --text: #ffffff;
      --text-muted: #8e95a5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Full Screen Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 70vh;
      min-height: 480px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .hero-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 13, 19, 0.2) 0%, rgba(11, 13, 19, 0.6) 50%, var(--bg) 100%);
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 10px;
    }

    .hero-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.8);
    }

    .meta-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .badge-season {
      background: rgba(255, 170, 0, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      color: #fff;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: 0.3s ease;
    }

    .brand-link:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--primary);
    }

    /* Main Content Container */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      flex: 1;
    }

    .section-head {
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 2 Cards Per Row Grid */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 170, 0, 0.35);
    }

    .card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-thumb img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 12px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-play {
      background: var(--primary);
      color: #0b0d13;
    }

    .btn-play:hover {
      background: var(--primary-hover);
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border);
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Loading / Empty State */
    .state-box {
      grid-column: span 2;
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .hero {
        height: 55vh;
        min-height: 380px;
      }
      .episodes-grid {
        gap: 12px;
      }
      .card-body {
        padding: 10px;
      }
      .card-title {
        font-size: 0.82rem;
      }
      .btn {
        padding: 8px 6px;
        font-size: 0.75rem;
        gap: 4px;
      }
    }
  </style>
</head>
<body>

  <!-- Full Screen Poster Section -->
  <section class="hero">
    <img src="https://images.slivcdn.com/videoasset_images/manage_file/1000024131/1789720680148261_Signature_Landscape_Thumb.jpg?w=500&q=low" alt="Family Full House With Rohit Sharma" class="hero-img">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Family Full House With Rohit Sharma</h1>
      <div class="meta-bar">
        <span class="badge-season"><i class="fa-solid fa-film"></i> Season 1</span>
        <a href="https://zxzxcxcc.github.io/flixcinema/" target="_blank" rel="noopener noreferrer" class="brand-link">
          <i class="fa-solid fa-play-circle" style="color: var(--primary);"></i> by FlixCinema
        </a>
      </div>
    </div>
  </section>

  <!-- Episodes Grid Container -->
  <main class="container">
    <div class="section-head">
      <h2 class="section-title">All Episodes</h2>
    </div>

    <div class="episodes-grid" id="episodes-list">
      <div class="state-box">
        <div class="spinner"></div>
        <p>Episodes load ho rahe hain...</p>
      </div>
    </div>
  </main>

  <script>
    const JSON_URL = 'https://toolsmax.site/flixcinema/ffh-show/episodes.json';
    const BASE_PATH = 'https://toolsmax.site/flixcinema/ffh-show/';

    async function loadEpisodes() {
      const container = document.getElementById('episodes-list');

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error('File fetch nahi hui');
        const episodes = await response.json();

        if (!Array.isArray(episodes) || episodes.length === 0) {
          container.innerHTML = `
            <div class="state-box">
              <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 10px;"></i>
              <p>Filhal koi episode uplabdh nahi hai.<br>Jald hi naye episodes add honge!</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';

        episodes.forEach(ep => {
          // Poster check: full URL ya relative path
          let posterUrl = ep.poster;
          if (posterUrl && !posterUrl.startsWith('http://') && !posterUrl.startsWith('https://')) {
            posterUrl = BASE_PATH + posterUrl;
          }

          // Stream URL path check
          let streamUrl = ep.stream_url;
          if (streamUrl && !streamUrl.startsWith('http://') && !streamUrl.startsWith('https://')) {
            streamUrl = BASE_PATH + streamUrl;
          }

          // Download URL path check
          let downloadUrl = ep.download_url;
          if (downloadUrl && !downloadUrl.startsWith('http://') && !downloadUrl.startsWith('https://')) {
            downloadUrl = BASE_PATH + downloadUrl;
          }

          // Android Intent URL for direct player stream
          const intentUrl = `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;type=video/*;end`;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-thumb">
              <img src="${posterUrl}" alt="${ep.title || 'Episode Poster'}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="card-title">${ep.title || 'Episode'}</div>
              <div class="actions-grid">
                <a href="${intentUrl}" class="btn btn-play">
                  <i class="fa-solid fa-play"></i> Play
                </a>
                <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-download">
                  <i class="fa-solid fa-download"></i> Save
                </a>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="state-box">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; color: #ff5555; margin-bottom: 10px;"></i>
            <p>Episodes load karne me samasya aayi.<br>Kripya internet connection aur URL path check karein.</p>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadEpisodes);
  </script>
</body>
</html>
