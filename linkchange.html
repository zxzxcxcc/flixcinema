<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M3U8 Stream Link Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      color: #38bdf8;
    }

    p.sub {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .result-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      display: none;
    }

    .output-text {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .copy-btn {
      background: #10b981;
    }

    .copy-btn:hover {
      background: #059669;
    }

    .toast {
      display: none;
      text-align: center;
      font-size: 0.8rem;
      color: #4ade80;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>M3U8 Link Converter</h2>
    <p class="sub">URL paste karein aur live .m3u8 link paayein</p>

    <label for="rawUrl">Input URL:</label>
    <input 
      type="text" 
      id="rawUrl" 
      placeholder="http://neoyjpw.top:8080/1/1/53649" 
      autocomplete="off"
    />

    <button class="btn" onclick="convertUrl()">Convert to .m3u8</button>

    <div class="result-box" id="resultBox">
      <label>Converted URL:</label>
      <div class="output-text" id="outputUrl"></div>
      <button class="btn copy-btn" id="copyBtn" onclick="copyResult()">Copy Link</button>
      <div class="toast" id="toastMsg">✓ Copied to clipboard!</div>
    </div>
  </div>

  <script>
    function convertUrl() {
      const input = document.getElementById("rawUrl").value.trim();
      const resultBox = document.getElementById("resultBox");
      const outputUrl = document.getElementById("outputUrl");
      const toast = document.getElementById("toastMsg");

      toast.style.display = "none";

      if (!input) {
        alert("Kripya valid URL enter karein!");
        return;
      }

      try {
        const urlObj = new URL(input);
        const parts = urlObj.pathname.split("/").filter(Boolean);

        // Agar URL http://host:port/username/password/id format me hai
        if (parts.length >= 3) {
          const user = parts[parts.length - 3];
          const pass = parts[parts.length - 2];
          let streamId = parts[parts.length - 1];

          // Agar pehle se .m3u8 laga ho toh remove karein
          streamId = streamId.replace(/\.m3u8$/i, "");

          // Format: http://host:port/live/user/pass/id.m3u8
          const converted = `${urlObj.origin}/live/${user}/${pass}/${streamId}.m3u8`;
          outputUrl.textContent = converted;
          resultBox.style.display = "block";
        } else {
          // Direct fallback: end me .m3u8 attach karein
          const fallback = input.endsWith(".m3u8") ? input : input + ".m3u8";
          outputUrl.textContent = fallback;
          resultBox.style.display = "block";
        }
      } catch (e) {
        // Normal string check agar proper http/https protocol na ho
        let cleanInput = input.replace(/\.m3u8$/i, "");
        outputUrl.textContent = cleanInput + ".m3u8";
        resultBox.style.display = "block";
      }
    }

    function copyResult() {
      const text = document.getElementById("outputUrl").textContent;
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toastMsg");
        toast.style.display = "block";
        setTimeout(() => {
          toast.style.display = "none";
        }, 2000);
      });
    }
  </script>

</body>
</html>
