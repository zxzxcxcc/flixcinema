<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Cinema Player</title>
  <!-- Modern SVG Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Top & Bottom Cinematic Gradient Overlays */
    .overlay-top,
    .overlay-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }

    .overlay-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
      padding: 25px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .overlay-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 60%, transparent 100%);
      padding: 30px 40px 25px;
      display: flex;
      flex-direction: column;
    }

    .player-container.hide-controls .overlay-top {
      opacity: 0;
      transform: translateY(-20px);
    }

    .player-container.hide-controls .overlay-bottom {
      opacity: 0;
      transform: translateY(20px);
    }

    .overlay-top *,
    .overlay-bottom * {
      pointer-events: auto;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #e50914; /* Netflix Red */
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span {
      color: #aaa;
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* Seekbar Timeline */
    .timeline-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      margin-bottom: 20px;
      transition: height 0.15s ease;
    }

    .timeline-container:hover {
      height: 9px;
    }

    .timeline-buffered {
      height: 100%;
      background: rgba(255, 255, 255, 0.4);
      position: absolute;
      border-radius: 4px;
      width: 0%;
    }

    .timeline-progress {
      height: 100%;
      background: #e50914;
      position: absolute;
      border-radius: 4px;
      width: 0%;
    }

    .timeline-thumb {
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #e50914;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.9);
      transition: transform 0.15s ease;
    }

    .timeline-container:hover .timeline-thumb {
      transform: translateY(-50%) scale(1);
    }

    /* Controls Row */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: #eee;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      transform: scale(1.2);
      color: #fff;
    }

    .time-info {
      font-size: 0.95rem;
      font-weight: 500;
      color: #bbb;
      margin-left: 5px;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    /* Speed Menu */
    .speed-menu {
      position: absolute;
      bottom: 80px;
      right: 40px;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      min-width: 150px;
      padding: 8px 0;
      z-index: 20;
    }

    .speed-menu.active {
      display: flex;
    }

    .speed-item {
      padding: 10px 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .speed-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .speed-item.active {
      color: #e50914;
      font-weight: 700;
    }

    /* Loading Spinner */
    .loader {
      position: absolute;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid #e50914;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      animation: spin 0.8s linear infinite;
      display: none;
      z-index: 6;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="player-container" id="player">
    <div class="loader" id="loader"></div>

    <!-- Video Element (Cross-origin handling enable) -->
    <video id="v" playsinline></video>

    <!-- Top Overlay -->
    <div class="overlay-top">
      <div class="brand-title">
        NETFLIX <span>Aether Streamer</span>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="overlay-bottom">
      <div class="timeline-container" id="timeline">
        <div class="timeline-buffered" id="buffered"></div>
        <div class="timeline-progress" id="progress"><div class="timeline-thumb"></div></div>
      </div>

      <div class="controls-row">
        <div class="controls-left">
          <button class="btn-icon" id="playBtn" title="Play (Space)">
            <i id="playIco" data-lucide="play" style="width: 26px; height: 26px;"></i>
          </button>

          <button class="btn-icon" id="rwdBtn" title="Rewind 10s">
            <i data-lucide="rotate-ccw" style="width: 22px; height: 22px;"></i>
          </button>

          <button class="btn-icon" id="fwdBtn" title="Forward 10s">
            <i data-lucide="rotate-cw" style="width: 22px; height: 22px;"></i>
          </button>

          <div class="volume-box">
            <button class="btn-icon" id="muteBtn" title="Mute (M)">
              <i id="volIco" data-lucide="volume-2" style="width: 20px; height: 20px;"></i>
            </button>
            <input type="range" class="volume-slider" id="vol" min="0" max="1" step="0.05" value="1" />
          </div>

          <div class="time-info">
            <span id="curTime">00:00</span> / <span id="durTime">00:00</span>
          </div>
        </div>

        <div class="controls-right">
          <button class="btn-icon" id="speedBtn" title="Playback Speed">
            <i data-lucide="settings" style="width: 22px; height: 22px;"></i>
          </button>
          <button class="btn-icon" id="fsBtn" title="Fullscreen (F)">
            <i id="fsIco" data-lucide="maximize" style="width: 22px; height: 22px;"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Speed Drawer -->
    <div class="speed-menu" id="speedMenu">
      <div class="speed-item" data-val="0.5">0.5x Speed</div>
      <div class="speed-item" data-val="0.75">0.75x Speed</div>
      <div class="speed-item active" data-val="1">1.0x Normal</div>
      <div class="speed-item" data-val="1.25">1.25x Speed</div>
      <div class="speed-item" data-val="1.5">1.5x Speed</div>
      <div class="speed-item" data-val="2">2.0x Speed</div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Raw Pixeldrain link
    const RAW_FILE_URL = "https://pixeldrain.com/api/file/CADjZ2YP";

    // Fallback pipeline to bypass CORS and Direct Streaming block
    const STREAM_SOURCES = [
      RAW_FILE_URL, // Try Direct
      `https://corsproxy.io/?url=${encodeURIComponent(RAW_FILE_URL)}`, // Fast Proxy Bypass
      `https://api.allorigins.win/raw?url=${encodeURIComponent(RAW_FILE_URL)}` // Secondary Proxy
    ];

    let currentSourceIndex = 0;
    const v = document.getElementById('v');
    const player = document.getElementById('player');
    const loader = document.getElementById('loader');
    const playBtn = document.getElementById('playBtn');
    const playIco = document.getElementById('playIco');
    const rwdBtn = document.getElementById('rwdBtn');
    const fwdBtn = document.getElementById('fwdBtn');
    const timeline = document.getElementById('timeline');
    const progress = document.getElementById('progress');
    const buffered = document.getElementById('buffered');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const muteBtn = document.getElementById('muteBtn');
    const volIco = document.getElementById('volIco');
    const vol = document.getElementById('vol');
    const fsBtn = document.getElementById('fsBtn');
    const fsIco = document.getElementById('fsIco');
    const speedBtn = document.getElementById('speedBtn');
    const speedMenu = document.getElementById('speedMenu');

    let hideTimer;

    function startStream(index) {
      loader.style.display = 'block';
      v.src = STREAM_SOURCES[index];
      v.load();
    }

    // Auto-fallback if direct play fails
    v.addEventListener('error', () => {
      currentSourceIndex++;
      if (currentSourceIndex < STREAM_SOURCES.length) {
        startStream(currentSourceIndex);
      } else {
        loader.style.display = 'none';
        alert("Video play nahi ho pa rahi hai. Kripya check karein ki Pixeldrain file link active hai ya nahi.");
      }
    });

    function fmt(s) {
      if (isNaN(s)) return "00:00";
      let m = Math.floor(s / 60);
      let sec = Math.floor(s % 60);
      return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function togglePlay() {
      if (v.paused) {
        v.play();
        playIco.setAttribute('data-lucide', 'pause');
      } else {
        v.pause();
        playIco.setAttribute('data-lucide', 'play');
      }
      lucide.createIcons();
    }

    playBtn.onclick = togglePlay;
    v.onclick = togglePlay;
    rwdBtn.onclick = () => { v.currentTime -= 10; };
    fwdBtn.onclick = () => { v.currentTime += 10; };

    v.onwaiting = () => { loader.style.display = 'block'; };
    v.oncanplay = () => { loader.style.display = 'none'; };

    v.ontimeupdate = () => {
      curTime.textContent = fmt(v.currentTime);
      progress.style.width = (v.currentTime / v.duration * 100) + '%';
      if (v.buffered.length > 0) {
        buffered.style.width = (v.buffered.end(v.buffered.length - 1) / v.duration * 100) + '%';
      }
    };

    v.onloadedmetadata = () => {
      durTime.textContent = fmt(v.duration);
    };

    timeline.onclick = (e) => {
      const rect = timeline.getBoundingClientRect();
      v.currentTime = ((e.clientX - rect.left) / rect.width) * v.duration;
    };

    vol.oninput = (e) => {
      v.volume = e.target.value;
      v.muted = (v.volume === 0);
      volIco.setAttribute('data-lucide', v.muted ? 'volume-x' : (v.volume < 0.5 ? 'volume-1' : 'volume-2'));
      lucide.createIcons();
    };

    muteBtn.onclick = () => {
      v.muted = !v.muted;
      vol.value = v.muted ? 0 : v.volume;
      volIco.setAttribute('data-lucide', v.muted ? 'volume-x' : 'volume-2');
      lucide.createIcons();
    };

    fsBtn.onclick = () => {
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(() => {});
        fsIco.setAttribute('data-lucide', 'minimize');
      } else {
        document.exitFullscreen();
        fsIco.setAttribute('data-lucide', 'maximize');
      }
      lucide.createIcons();
    };

    speedBtn.onclick = () => { speedMenu.classList.toggle('active'); };

    document.querySelectorAll('.speed-item').forEach(item => {
      item.onclick = () => {
        document.querySelectorAll('.speed-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        v.playbackRate = parseFloat(item.dataset.val);
        speedMenu.classList.remove('active');
      };
    });

    player.onmousemove = () => {
      player.classList.remove('hide-controls');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!v.paused) {
          player.classList.add('hide-controls');
          speedMenu.classList.remove('active');
        }
      }, 3000);
    };

    window.onkeydown = (e) => {
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
      if (e.key === 'ArrowRight') v.currentTime += 10;
      if (e.key === 'ArrowLeft') v.currentTime -= 10;
      if (e.key.toLowerCase() === 'f') fsBtn.click();
    };

    // Initialize playback
    startStream(0);
  </script>
</body>
</html>
