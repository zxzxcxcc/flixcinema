<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Live TV Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Player Styling -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.6.2/plyr.css" />
    <link rel="shortcut icon" type="image/x-icon" href="https://i.ibb.co/BcjC6R8/jiotv.png">
    
    <!-- JW Player Script -->
    <script type="text/javascript" src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            background: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #myElement {
            position: relative;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>

    <div id="myElement"></div>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const playerConfig = {
                title: 'Live Stream',
                description: "Live TV",
                aspectratio: '16:9',
                width: '100%',
                height: '100%',
                mute: false,
                autostart: true,
                // Aapka Live Stream URL
                file: "http://ncvbtaqi.icelil.com/live/JURITIRAN/WG4ZBG6/1404537.ts",
                type: "mp4", // Browser direct .ts container ko MP4/video stream mode me play karta hai
                skin: {
                    name: "netflix"
                }
            };

            const player = jwplayer("myElement").setup(playerConfig);
        });
    </script>
</body>

</html>
